<style>
  /* ===== DISEÑO =====
     Paleta: https://colorhunt.co/palette/000000233d4dfe7f2deaecf0
     Cambia solo estos valores para retocar colores. */
  :root {
    --color-black: #000000;        /* texto principal */
    --color-navy: #233d4d;         /* menú lateral y botón principal */
    --color-orange: #fe7f2d;       /* opción activa */
    --color-light: #eaecf0;        /* fondo general */
    --color-line: rgba(35, 61, 77, 0.35);  /* bordes finos */
    --color-muted: rgba(0, 0, 0, 0.6);     /* textos secundarios */
    /* SF Pro es la tipografía del sistema de Apple: se usa si está instalada en el dispositivo.
       En otros equipos se usa la fuente del sistema. */
    --font-text: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
    --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font-text);
    font-size: 15px;
    line-height: 1.5;
    font-weight: 400;
    letter-spacing: 0;
    background: var(--color-light);
    color: var(--color-black);
    display: flex;
    min-height: 100vh;
  }
  aside {
    width: 260px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    background: var(--color-navy);
    color: var(--color-light);
    padding: 20px 12px;
  }
  aside h1 { font-family: var(--font-display); font-size: 16px; font-weight: 500; margin: 0 6px 18px; display: flex; align-items: center; justify-content: flex-start; gap: 8px; }
  aside h1 .logo { width: 20px; height: 20px; object-fit: contain; }
  aside .tienda { color: var(--color-light); margin: 0 6px 16px; font-size: 13px; }
  aside select {
    font: inherit;
    font-size: 15px;
    color: var(--color-black);
    background: var(--color-light);
    border: 1px solid var(--color-light);
    border-radius: 0;
    padding: 4px 8px;
    width: 100%;
  }
  aside details.grupo { margin: 0 0 10px; }
  aside .pie { margin-top: auto; padding: 16px 6px 0; font-size: 12px; opacity: 0.7; }
  aside .grupo { margin-bottom: 10px; }
  .casillas { display: grid; gap: 6px; }
  .casillas label { flex-direction: row; align-items: center; gap: 8px; font-size: 14px; color: var(--color-black); }
  .casillas input { width: auto; margin: 0; }
  #menuImpresos { display: flex; gap: 6px; }
  #menuImpresos button { width: auto; flex: 1; text-align: center; }
  aside .cabecera {
    font-size: 13px;
    color: var(--color-light);
    opacity: 0.7;
    padding: 6px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  aside summary {
    cursor: pointer;
    list-style: none;
    font-size: 13px;
    color: var(--color-light);
    opacity: 0.7;
    padding: 6px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  aside summary:hover { opacity: 1; }
  aside summary::-webkit-details-marker { display: none; }
  aside summary::after { content: "−"; transition: transform 0.2s; }
  aside details.grupo:not([open]) summary::after { content: "+"; }
  aside button {
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    color: var(--color-light);
    border: 0;
    border-radius: 0;
    padding: 6px 8px;
    margin-bottom: 2px;
    font: inherit;
    font-size: 15px;
    line-height: 1.4;
    cursor: pointer;
  }
  aside button:hover { color: var(--color-orange); }
  aside button.activo { background: var(--color-orange); color: var(--color-black); }

  main { flex: 1; padding: 28px; max-width: 1000px; }
  main h2 { font-family: var(--font-display); font-size: 18px; font-weight: 500; margin: 0 0 4px; }
  .descripcion { color: var(--color-muted); font-size: 13px; margin: 0 0 24px; }

  .campos {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 10px;
    margin-bottom: 24px;
  }
  label { display: flex; flex-direction: column; font-size: 12px; color: var(--color-muted); gap: 4px; }
  input, textarea, select {
    font: inherit;
    font-size: 14px;
    line-height: 1.4;
    color: var(--color-black);
    background: transparent;
    border: 1px solid var(--color-line);
    border-radius: 0;
    padding: 4px 8px;
  }
  input::placeholder, textarea::placeholder { color: var(--color-muted); }
  input:focus, textarea:focus, select:focus { outline: 1px solid var(--color-navy); outline-offset: 0; }
  label.ancho { grid-column: 1 / -1; }

  .tarjeta {
    background: transparent;
    border: 1px solid var(--color-line);
    padding: 14px;
  }
  .tarjeta textarea { width: 100%; min-height: 300px; border: 0; background: transparent; padding: 0; font-size: 14px; line-height: 1.55; resize: vertical; }
  .tarjeta textarea:focus { outline: none; }

  .acciones { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
  .boton {
    background: var(--color-navy);
    color: var(--color-light);
    border: 1px solid var(--color-navy);
    border-radius: 0;
    padding: 4px 10px;
    font: inherit;
    font-size: 13px;
    line-height: 1.4;
    cursor: pointer;
  }
  .boton:hover { background: var(--color-orange); border-color: var(--color-orange); color: var(--color-black); }
  .boton.secundario {
    background: transparent;
    color: var(--color-navy);
    border: 1px solid var(--color-line);
  }
  .boton.secundario:hover { background: transparent; border-color: var(--color-orange); color: var(--color-orange); }
  .aviso { color: var(--color-navy); font-size: 13px; }

  /* ===== Caducidad PSA ===== */
  #panelPsa { display: none; max-width: 420px; }
  .psa-entrada { display: flex; gap: 6px; align-items: stretch; }
  .psa-entrada input { flex: 1; font-size: 20px; letter-spacing: 0.4em; text-align: center; padding: 6px 8px; }
  .psa-entrada input.error { border-color: var(--color-orange); }
  .psa-pista { color: var(--color-orange); font-size: 12px; min-height: 18px; margin: 4px 0 12px; }
  #psaResultado { display: none; margin-top: 18px; }
  .psa-fila { display: flex; justify-content: space-between; font-size: 14px; padding: 4px 0; border-bottom: 1px solid var(--color-line); }
  .psa-fila span:first-child { color: var(--color-muted); }
  .psa-caducidad { margin-top: 14px; padding: 10px 14px; border: 1px solid var(--color-line); display: flex; justify-content: space-between; align-items: center; }
  .psa-caducidad strong { font-family: var(--font-display); font-size: 17px; font-weight: 500; text-transform: capitalize; }
  .psa-caducidad.ok { border-left: 4px solid #2e8b57; }
  .psa-caducidad.aviso-psa { border-left: 4px solid var(--color-orange); }
  .psa-caducidad.caducado { border-left: 4px solid #c0392b; background: rgba(192, 57, 43, 0.06); }
  .psa-estado { color: var(--color-muted); font-size: 13px; margin-top: 8px; }

  @media (max-width: 720px) {
    body { flex-direction: column; }
    aside { width: 100%; }
    main { padding: 16px; }
  }
</style>
</head>

<script>

Opción 1 (solo si tu equipo tiene iOS 27 o posterior): en la app Buscar, selecciona tu ${d.equipo}, toca Más, entra en «Reparación o Renovación», pulsa Activar y confirma con la contraseña de tu cuenta de Apple. Así Buscar se queda activado y puedes seguir el estado de la reparación.

Opción 2: entra en icloud.com/find, inicia sesión con tu cuenta de Apple, elige tu ${d.equipo} y pulsa «Eliminar este dispositivo». Tus datos y fotos no se borran.

Cuando lo tengas, respóndenos a este correo. ¡Gracias!

Un saludo,
El equipo de ${d.tienda}`

    {

      texto: d => `Hola ${d.cliente}:

Ya hemos revisado tu ${d.equipo}. Para arreglarlo hay que ${d.trabajo}.

Un saludo,

      texto: d => `Hola ${d.cliente}:

¡Tu ${d.equipo} ya está listo!

¡Te esperamos!

Un saludo,
El equipo de ${d.tienda}`

    {

      descripcion: "Contar al cliente que ha surgido un imprevisto y qué va a pasar ahora.",
      campos: [
        { id: "motivo", etiqueta: "Motivo", opciones: [
          { valor: "stock", texto: "Rotura de stock" },
          { valor: "otro", texto: "Otro imprevisto" }

        { id: "fechaReposicion", etiqueta: "Fecha aproximada de reposición (si es rotura de stock)", tipo: "fecha", ancho: true },

      ],
      texto: d => {
        if (d.motivo === "stock") {
          return `Hola ${d.cliente}:

Te escribimos sobre la reparación de tu ${d.equipo}. La pieza que necesitamos está agotada (rotura de stock).

Un saludo,
El equipo de ${d.tienda}`;
        }
        return `Hola ${d.cliente}:

Ha surgido un imprevisto con tu ${d.equipo}: ${d.problema}. Sentimos el retraso.

Un saludo,

    {

${lista}

Puedes enviárnoslo respondiendo a este correo.

Un saludo,

 - En revisión por Apple, a la espera de resolución.

  const ORDEN_CASILLAS = ["smart", "componente", "accesorio", "ordenador"];

  const valores = {};
  let actual = tipos[0];

  const $ = id => document.getElementById(id);

  function crearTiendas() {
    tiendas.forEach(t => {
      const o = document.createElement("option");
      o.value = t.id;
      o.textContent = t.nombre;
      $("tienda").appendChild(o);
    });
    $("tienda").onchange = () => {
      tienda = tiendas.find(t => t.id === $("tienda").value);
      generar();
    };
  }

  function crearMenu() {
    tipos.forEach(t => {
      const b = document.createElement("button");
      b.textContent = t.nombre;
      b.dataset.id = t.id;
      b.onclick = () => seleccionar(t);
      $(t.grupo || (t.interno ? "menuInterno" : "menu")).appendChild(b);
    });
  }

  function crearCampo(c) {
    const label = document.createElement("label");
    if (c.ancho) label.className = "ancho";
    label.textContent = c.etiqueta;
    let input;
    if (c.tipo === "casillas") {
      label.className += " casillas-grupo";
      input = document.createElement("div");
      input.className = "casillas";
      if (!valores[c.id]) valores[c.id] = [];
      c.opciones.forEach(o => {
        const l = document.createElement("label");
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = valores[c.id].includes(o.valor);
        cb.onchange = () => {
          valores[c.id] = c.opciones.map(x => x.valor).filter(v => v === o.valor ? cb.checked : valores[c.id].includes(v));
        };
        l.append(cb, o.texto);
        input.appendChild(l);
      });
    } else if (c.tipo === "fecha") {
      if (c.hoy && !valores[c.id]) {
        const n = new Date(), p = x => String(x).padStart(2, "0");
        valores[c.id] = `${n.getFullYear()}-${p(n.getMonth() + 1)}-${p(n.getDate())}`;
      }
      input = document.createElement("input");
      input.type = "date";
      input.value = valores[c.id] || "";
      input.onchange = () => { valores[c.id] = input.value; generar(); };
    } else if (c.opciones) {
      input = document.createElement("select");
      if (valores[c.id] === undefined) valores[c.id] = c.opciones[0].valor;
      c.opciones.forEach(o => {
        const op = document.createElement("option");
        op.value = o.valor;
        op.textContent = o.texto;
        input.appendChild(op);
      });
      input.value = valores[c.id];
      input.onchange = () => { valores[c.id] = input.value; generar(); };
    } else {
      input = document.createElement(c.multilinea ? "textarea" : "input");
      if (c.multilinea) input.rows = 3;
      input.placeholder = c.ejemplo;
      input.value = valores[c.id] || "";
      input.oninput = () => { valores[c.id] = input.value; generar(); };
    }
    label.appendChild(input);
    return label;
  }

  function mostrarPanelMensajes(visible) {
    const pdf = visible && actual.pdf;
    $("campos").style.display = visible ? "" : "none";
    $("acciones").style.display = visible && !pdf ? "" : "none";
    document.querySelector(".tarjeta").style.display = visible && !pdf ? "" : "none";
    $("panelPdf").style.display = pdf ? "block" : "none";
    $("panelPsa").style.display = visible ? "none" : "block";
  }

  function seleccionar(t) {
    actual = t;
    mostrarPanelMensajes(true);
    document.querySelectorAll("aside button").forEach(b => b.classList.toggle("activo", b.dataset.id === t.id));
    $("titulo").textContent = t.nombre;
    $("descripcion").textContent = t.descripcion;
    const campos = $("campos");
    campos.innerHTML = "";
    [...(t.interno ? [] : comunes), ...t.campos].forEach(c => campos.appendChild(crearCampo(c)));
    if (!t.pdf) generar();
    $("pdfAviso").textContent = "";
  }

  async function generarPdf() {
    const cfg = PDFS[actual.pdf];
    const aviso = $("pdfAviso");
    const cantidad = (valores.pdfCantidad || "").trim();
    if (!valores.pdfFecha) { aviso.textContent = "Indica la fecha."; return; }
    if (!cantidad) { aviso.textContent = "Indica la cantidad."; return; }
    if (!window.PDFLib) { aviso.textContent = "No se pudo cargar la librería PDF (¿sin conexión?)."; return; }
    const ventana = window.open("", "_blank");
    try {
      const { PDFDocument, StandardFonts, rgb } = PDFLib;
      const doc = await PDFDocument.load(cfg.b64);
      const pagina = doc.getPage(0);
      const fuente = await doc.embedFont(StandardFonts.Helvetica);
      const negrita = await doc.embedFont(StandardFonts.HelveticaBold);
      const [y, m, d] = valores.pdfFecha.split("-");
      pagina.drawText(`${d}/${m}/${y}`, { x: cfg.fecha[0], y: cfg.fecha[1], size: 10, font: fuente, color: rgb(0, 0, 0) });
      const ancho = negrita.widthOfTextAtSize(cantidad, 14);
      pagina.drawText(cantidad, { x: cfg.cantidad[0] - ancho / 2, y: cfg.cantidad[1], size: 14, font: negrita, color: rgb(0, 0, 0) });
      (valores.pdfCasillas || []).forEach(v => {
        const [x, yy, l] = cfg.casillas[ORDEN_CASILLAS.indexOf(v)];
        const o = { thickness: 1, color: rgb(0, 0, 0) };
        pagina.drawLine({ start: { x: x + 1, y: yy + 1 }, end: { x: x + l - 1, y: yy + l - 1 }, ...o });
        pagina.drawLine({ start: { x: x + 1, y: yy + l - 1 }, end: { x: x + l - 1, y: yy + 1 }, ...o });
      });
      const bytes = await doc.save();
      const url = URL.createObjectURL(new Blob([bytes], { type: "application/pdf" }));
      if (ventana) ventana.location = url;
      else {
        const a = document.createElement("a");
        a.href = url; a.download = `${cfg.nombre}_${valores.pdfFecha}.pdf`; a.click();
      }
      aviso.textContent = "PDF generado.";
    } catch (e) {
      if (ventana) ventana.close();
      aviso.textContent = "Error al generar el PDF: " + e.message;
    }
  }
  $("pdfGenerar").onclick = generarPdf;

  function generar() {
    if (actual.pdf) return;
    const d = {
      tienda: tienda.firma,
      tecnico: tienda.tecnico,
      fecha: new Date().toLocaleDateString("es-ES")
    };
    const base = actual.interno ? [] : comunes;
    [...base, ...actual.campos].forEach(c => {
      d[c.id] = (valores[c.id] || "").trim() || `[${c.etiqueta}]`;
      if (c.opciones) d[c.id] = valores[c.id];
      if (c.tipo === "fecha" && valores[c.id]) {
        const [y, m, dia] = valores[c.id].split("-").map(Number);
        d[c.id] = new Date(y, m - 1, dia).toLocaleDateString("es-ES", { day: "numeric", month: "long" });
      }
    });
    if (!(valores.horario || "").trim() && tienda.horario) d.horario = tienda.horario;
    $("mensaje").value = actual.texto(d);
  }

  async function copiar(texto) {
    try {
      await navigator.clipboard.writeText(texto);
    } catch (e) {
      const t = document.createElement("textarea");
      t.value = texto;
      document.body.appendChild(t);
      t.select();
      document.execCommand("copy");
      t.remove();
    }
    $("aviso").textContent = "¡Copiado!";
    setTimeout(() => $("aviso").textContent = "", 2000);
  }

  $("copiar").onclick = () => copiar($("mensaje").value);
  $("refrescar").onclick = () => {
    [...(actual.interno ? [] : comunes), ...actual.campos].forEach(c => delete valores[c.id]);
    seleccionar(actual);
  };

  // ===== Caducidad PSA =====
  // Caducidad PSA a partir del número 9D (AASS: año y semana de producción) + 18 meses.
  const MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];

  function semanaAFecha(anio, semana) {
    const d = new Date(anio, 0, 1), dow = d.getDay() || 7;
    const lunes1 = new Date(anio, 0, dow <= 4 ? 2 - dow : 9 - dow);
    const r = new Date(lunes1);
    r.setDate(lunes1.getDate() + (semana - 1) * 7);
    return r;
  }

  function sumarMeses(d, m) { const r = new Date(d); r.setMonth(r.getMonth() + m); return r; }

  function abrirPsa() {
    document.querySelectorAll("aside button").forEach(b => b.classList.toggle("activo", b.dataset.id === "psa"));
    $("titulo").textContent = "Caducidad PSA";
    $("descripcion").textContent = "Calcula la caducidad de un PSA a partir de su número 9D (año + semana de producción). Caduca a los 18 meses.";
    mostrarPanelMensajes(false);
    $("psaCodigo").focus();
  }

  function calcularPsa() {
    const v = $("psaCodigo").value.trim();
    const error = texto => {
      $("psaCodigo").classList.add("error");
      $("psaPista").textContent = texto;
      $("psaResultado").style.display = "none";
    };
    if (!/^\d{4}$/.test(v)) return error("Introduce 4 dígitos (ej: 2324)");
    const sem = parseInt(v.slice(2), 10);
    if (sem < 1 || sem > 53) return error("La semana debe estar entre 01 y 53");
    $("psaCodigo").classList.remove("error");
    $("psaPista").textContent = "";
    const anio = 2000 + parseInt(v.slice(0, 2), 10);
    const prod = semanaAFecha(anio, sem), caduca = sumarMeses(prod, 18), hoy = new Date();
    $("psaAnio").textContent = anio;
    $("psaSemana").textContent = "Semana " + sem;
    $("psaProduccion").textContent = prod.toLocaleDateString("es-ES", { day: "2-digit", month: "2-digit", year: "numeric" });
    $("psaFecha").textContent = MESES[caduca.getMonth()] + " " + caduca.getFullYear();
    const meses = (caduca.getFullYear() - hoy.getFullYear()) * 12 + (caduca.getMonth() - hoy.getMonth());
    const tarjeta = $("psaTarjeta");
    tarjeta.className = "psa-caducidad";
    if (caduca < hoy) { tarjeta.classList.add("caducado"); $("psaEstado").textContent = "Este PSA ha caducado."; }
    else if (meses <= 3) { tarjeta.classList.add("aviso-psa"); $("psaEstado").textContent = "Caduca en menos de " + meses + " mes" + (meses === 1 ? "" : "es") + "."; }
    else { tarjeta.classList.add("ok"); $("psaEstado").textContent = meses + " meses restantes."; }
    $("psaResultado").style.display = "block";
  }

  function nuevaPsa() {
    $("psaCodigo").value = "";
    $("psaCodigo").classList.remove("error");
    $("psaPista").textContent = "";
    $("psaResultado").style.display = "none";
    $("psaCodigo").focus();
  }

  $("botonPsa").onclick = abrirPsa;
  $("psaCalcular").onclick = calcularPsa;
  $("psaNueva").onclick = nuevaPsa;
  $("psaCodigo").addEventListener("keydown", e => { if (e.key === "Enter") calcularPsa(); });
  $("psaCodigo").addEventListener("input", function () { this.value = this.value.replace(/\D/g, ""); });

  crearTiendas();
  crearMenu();
  seleccionar(tipos[0]);
</script>
</body>
</html>
